name: Build and release

# UN SEUL workflow, sur le meme modele que ceux d'AKA-Love et de MicroPython-AKA : a chaque mise a jour
# de la branche principale, compile + teste + publie AKA-IDE (Windows et Linux, executable autonome),
# et cree une Release GitHub en incrementant la version MINEURE (v1.4.2 -> v1.5.0). Rien n'est publie
# si la compilation ou les tests echouent.
#
# Remplace .github/workflows/main.yml (CI seule, sans release) : gardez l'un ou l'autre, pas les deux --
# celui-ci fait tout ce que main.yml faisait (build + tests), en plus de publier.
#
# Pull request : build + tests tournent, sans release. Declenchement manuel : compile et publie comme
# un push.

on:
  push:
    branches: [main, avalonia]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main, avalonia]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  workflow_dispatch:

permissions:
  contents: write # creer la Release et y attacher les fichiers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore GamebuinoAKA.sln

      - name: Build
        run: dotnet build GamebuinoAKA.sln --configuration Release --no-restore

      - name: Run Core tests
        run: >
          dotnet test tests/GamebuinoAKA.Core.Tests/GamebuinoAKA.Core.Tests.csproj
          --configuration Release --no-build --verbosity normal

      # Un seul fichier autonome (le runtime .NET est inclus dedans) : rien d'autre a installer pour
      # l'utilisateur final.
      - name: Publish
        run: >
          dotnet publish src/GamebuinoAKA.App/GamebuinoAKA.App.csproj
          --configuration Release --runtime ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/${{ matrix.rid }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path artifacts/${{ matrix.rid }}/* -DestinationPath aka-ide-${{ matrix.rid }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: (cd artifacts/${{ matrix.rid }} && zip -r ../../aka-ide-${{ matrix.rid }}.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.rid }}
          path: aka-ide-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name != 'pull_request'
    needs: [app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Next minor version
        id: version
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor _ <<< "${last#v}"
          echo "tag=v${major}.$((minor + 1)).0" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cd artifacts
          for f in aka-ide-*.zip; do mv "$f" "${f%.zip}-${TAG}.zip"; done
          ls -l
          gh release create "$TAG" aka-ide-*.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      # Optionnel : prévient le dépôt "AKA Toolkit" qu'une nouvelle version d'AKA-IDE est disponible.
      # Nécessite un secret TOOLKIT_DISPATCH_TOKEN (PAT avec le droit "repo" sur le dépôt du Toolkit) ;
      # sans ce secret, échoue silencieusement sans bloquer la release ci-dessus.
      - name: Notify AKA Toolkit (optional)
        if: always() && env.TOOLKIT_DISPATCH_TOKEN != ''
        env:
          TOOLKIT_DISPATCH_TOKEN: ${{ secrets.TOOLKIT_DISPATCH_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: token $TOOLKIT_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Jicehel-Aka/AKA-Toolkit/dispatches" \
            -d '{"event_type":"aka-source-released","client_payload":{"repo":"'"$GH_REPO"'","tag":"'"$TAG"'"}}' \
            || true
